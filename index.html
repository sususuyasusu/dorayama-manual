<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5b37">
<link rel="apple-touch-icon" href="./img/apple-touch-icon.png">
<link rel="icon" href="./img/icon-192.png">
<link rel="manifest" href="./manifest.json">
<title>どら山 スタッフマニュアル</title>
<style>
:root{--appw:520px;
  --bg:#1d5b37;--card:#f4f3ec;--ink:#2a2420;--sub:#8a8178;--line:#e3ddd1;
  --cream:#f4f8ee;--onbg:#bcd3a8;--sheetbg:#f2f6ec;
  --coral:#d8552c;--green:#5a9a1e;--amber:#dd8a00;--blue:#2f7ed8;--red:#d23b32;
  --coral-bg:#fcebe3;--green-bg:#eef6e2;--amber-bg:#fdf0d8;--blue-bg:#e6effb;--gray-bg:#f1ede6;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 2px 10px rgba(60,40,20,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
/* 背景：深緑に、薄い白ロゴの模様をゆっくり流し、ざらつきの質感を重ねる（在庫アプリと同じ） */
#bgpat,.topbar-pattern{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#bgpat::before,.topbar-pattern::before{content:"";position:absolute;top:0;left:0;height:100%;width:300%;
  background-image:url('./img/bg-pattern-v2.svg');background-repeat:repeat;background-size:230px 230px;
  opacity:.10;will-change:transform;animation:bgslide 26s linear infinite}
@keyframes bgslide{from{transform:translateX(0)}to{transform:translateX(-230px)}}
@media (prefers-reduced-motion:reduce){#bgpat::before,.topbar-pattern::before{animation:none}}
#grain,.topbar-grain{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:url('./img/grain.png');background-repeat:repeat;background-size:200px 200px;
  opacity:.44;mix-blend-mode:overlay}
.wrap{max-width:var(--appw);margin:0 auto;padding:0 12px}
/* ヘッダー（上下の背景が途切れないよう、同じ模様を帯の範囲だけ切り抜いて重ねる） */
.topbar{position:sticky;top:0;z-index:30;clip-path:inset(0);padding-top:env(safe-area-inset-top)}
.topbar-backdrop{position:fixed;inset:0;z-index:-1;background:var(--bg);isolation:isolate;pointer-events:none}
header.top{max-width:var(--appw);margin:0 auto;padding:13px 14px 11px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ttl{display:flex;align-items:center;gap:9px;min-width:0;color:var(--cream);font-size:19px;font-weight:800;letter-spacing:.02em}
.ttl .hdlogo{height:27px;width:auto;display:block;flex:none}
.ttl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hbtn{border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.12);color:var(--cream);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:800;flex:none}
.hbtn:active{transform:scale(.96)}
/* ホーム */
.search{margin:6px 0 2px}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:11px 18px;font-size:15px;color:var(--ink);outline:none}
.search input::placeholder{color:var(--sub)}
h2.sec{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--onbg);margin:22px 2px 9px;letter-spacing:.04em}
h2.sec:after{content:"";flex:1;height:1px;background:rgba(255,255,255,.2)}
.updates{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.upd{display:flex;gap:10px;padding:11px 14px;border-top:1px solid var(--line);align-items:flex-start}
.upd:first-child{border-top:0}
.upd[onclick]{cursor:pointer}
.upd[onclick]:active{background:var(--gray-bg)}
.upd .d{font-size:12px;color:var(--sub);font-weight:700;white-space:nowrap;padding-top:2px}
.upd .tt{font-weight:800;font-size:14px}
.upd .no{font-size:13px;color:#6b625a;margin-top:2px}
.upd .cat{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;color:#fff;margin-left:6px;vertical-align:1px}
.badge{display:inline-block;background:var(--coral);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.moreu{width:100%;border:0;border-top:1px solid var(--line);background:var(--gray-bg);padding:11px;font-size:13px;color:var(--coral);font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:2px}
.cat-card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ac);border-radius:13px;box-shadow:var(--shadow);
  color:var(--ink);text-align:left;padding:11px 11px 10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;
  min-height:96px;transition:transform .12s}
.cat-card:active{transform:scale(.97)}
.cat-card .e{width:34px;height:34px;border-radius:10px;background:var(--lt);display:grid;place-items:center;font-size:19px;line-height:1;margin-bottom:2px}
.cat-card .n{font-weight:800;font-size:15px;line-height:1.25}
.cat-card .s{font-size:11px;color:var(--sub);font-weight:700;line-height:1.35}
.foot{margin:26px 4px;font-size:12.5px;color:var(--onbg);text-align:center;line-height:1.8}
.foot a{color:var(--cream);font-weight:700}
/* カテゴリ画面（色は --ac=濃い色 / --lt=薄い色 を各画面から受け取る） */
.catpage{--ac:#8B5E3C;--lt:#F3E5D8}
.cathead{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ac);
  border-radius:14px;box-shadow:var(--shadow);padding:13px 16px;margin-top:12px}
.cathead .e{flex:none;width:42px;height:42px;border-radius:12px;background:var(--lt);display:grid;place-items:center;font-size:24px;line-height:1}
.cathead .n{font-size:19px;font-weight:800;line-height:1.3}
.cathead .s{font-size:12.5px;color:var(--sub);font-weight:700;margin-top:1px}
.bar{display:flex;align-items:center;gap:9px;color:var(--cream);font-size:15.5px;font-weight:800;margin:22px 2px 9px;letter-spacing:.02em}
.bar:before{content:"";flex:none;width:6px;height:19px;border-radius:3px;background:var(--lt)}
.bar:after{content:"";flex:1;height:1px;background:rgba(255,255,255,.2)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;margin:7px 0;display:flex;gap:10px}
.item .lb{flex:0 0 auto;max-width:38%;font-weight:800;font-size:13.5px;padding:3px 9px;border-radius:8px;align-self:flex-start;background:var(--lt);color:var(--ac)}
.item .tx{flex:1;font-size:14px}
.bul{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:9px 12px;margin:7px 0;font-size:14px;display:flex;gap:9px}
.bul:before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-top:.62em}
.note{border-radius:12px;padding:10px 13px;margin:8px 0;font-size:13.5px;font-weight:700}
.note.warn{background:var(--coral-bg);color:#8a3b1c;border:1px solid #f1cbb9}
.note.memo{background:var(--amber-bg);color:#8a5a00;border:1px solid #f0d9a0}
.note.star{background:var(--amber-bg);color:#7a4d00;border:1px solid #f0d9a0;border-left:5px solid var(--amber)}
.ng{background:#fdecea;border:1px solid #f0c4c1;color:#8b2a24;border-radius:12px;padding:10px 12px;margin:7px 0;font-weight:800;font-size:14px;display:flex;gap:9px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.flow .st{background:var(--card);border:1.5px solid var(--ac);color:var(--ac);border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px}
.flow .st.last{background:var(--ac);color:#fff}
.flow .ar{font-weight:800;color:var(--cream)}
.fifo{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;margin:8px 0}
.fifo .cap{font-size:12.5px;font-weight:700;color:#7f6a55;margin-bottom:8px}
.fifo .g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fifo .c{border-radius:9px;padding:9px 8px;font-size:12.5px;font-weight:700;color:#703000;text-align:center}
.fifo .n{font-size:11.5px;color:#c0500d;margin-top:7px;text-align:center}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.quad .q{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.quad .qh{background:var(--ac);color:#fff;font-weight:800;font-size:13px;padding:6px 9px;text-align:center}
.quad .qb{background:var(--lt);padding:8px 9px;font-size:12.5px;font-weight:700;text-align:center}
.ph{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin:10px 0}
.ph img{width:100%;display:block}
.ph .cap{font-size:12.5px;font-weight:700;color:#5d5546;padding:8px 12px;background:var(--gray-bg)}
/* 検索結果 */
.hit{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;margin:8px 0}
.hit .c{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:1px 7px;margin-bottom:4px}
.hit .h{font-weight:800;font-size:13.5px}
.hit .t{font-size:13px;color:#6b625a}
mark{background:#ffe28a;border-radius:3px;padding:0 1px}
/* モーダル（下からせり上がる） */
#modal{position:fixed;inset:0;background:rgba(40,30,20,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
@keyframes slideUp{0%{opacity:0;transform:translateY(26px)}100%{opacity:1;transform:translateY(0)}}
#modal.on .sheet{animation:slideUp .42s cubic-bezier(.22,.61,.36,1)}
.sheet{background:var(--sheetbg);border-radius:18px 18px 0 0;width:100%;max-width:var(--appw);padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;box-shadow:0 -6px 30px rgba(0,0,0,.25)}
.sheet h3{margin:0 0 12px;font-size:17px;font-weight:800}
.sheet label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:11px 0 4px}
.sheet input,.sheet textarea,.sheet select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;background:var(--card);color:var(--ink);outline:none}
.sheet textarea{min-height:84px}
.srow{display:flex;gap:10px}
.srow>div{flex:1}
.sheet .go{width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:800;color:#fff;background:var(--coral);margin-top:16px}
.sheet .go:active{transform:scale(.98)}
.sheet .cancel{width:100%;border:0;background:none;padding:11px;font-size:13.5px;color:var(--sub)}
.err{color:var(--red);font-size:13px;font-weight:700;margin-top:8px;display:none}
/* トースト・写真の拡大・読み込み */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;border-radius:999px;padding:11px 18px;z-index:50;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:88%;text-align:center}
#lightbox{position:fixed;inset:0;background:rgba(28,20,14,.84);z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:22px;cursor:zoom-out}
#lightbox img{max-width:92vw;max-height:80vh;border-radius:16px;box-shadow:0 22px 60px rgba(0,0,0,.55)}
#lightbox .cap{color:#eee;font-size:13px;padding:0 16px;text-align:center}
#load{padding:60px 0;text-align:center;color:var(--onbg);font-size:14px;line-height:1.8}
/* アイコン（在庫アプリの下タブと同じ：細い線・丸い端・単色） */
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none}
h2.sec .ic{width:16px;height:16px;vertical-align:-.2em}
.cat-card .e,.cathead .e{color:var(--ac)}
.cat-card .e .ic{width:20px;height:20px;vertical-align:0}
.cathead .e .ic{width:24px;height:24px;vertical-align:0}
.search{position:relative}
.search .ic{position:absolute;left:16px;top:50%;margin-top:-9px;width:18px;height:18px;color:var(--sub);pointer-events:none}
.search input{padding-left:42px}
.moreu .ic{width:16px;height:16px;vertical-align:-.25em}
.hbtn .ic{width:15px;height:15px;margin-right:4px;vertical-align:-.22em}
.note.warn,.note.star{display:flex;gap:8px;align-items:flex-start}
.note .ic{width:17px;height:17px;margin-top:1px}
.note.warn .ic{color:var(--coral)}
.note.star .ic{color:var(--amber)}
.ng .x{flex:none;width:22px;height:22px;border-radius:7px;background:var(--red);color:#fff;display:grid;place-items:center;align-self:flex-start}
.ng .x .ic{width:14px;height:14px;stroke-width:2.4;vertical-align:0}
.flow .ar{display:inline-flex;align-items:center}
.flow .ar .ic{width:15px;height:15px;vertical-align:0}
.ph .cap .ic{width:15px;height:15px;vertical-align:-.25em;margin-right:4px;color:var(--sub)}
.sheet h3 .ic{width:20px;height:20px;vertical-align:-.28em;margin-right:5px;color:var(--coral)}
.foot .ic{width:15px;height:15px;vertical-align:-.25em;margin-right:3px}
#toast .ic{width:17px;height:17px;vertical-align:-.3em;margin-right:5px}
.hit .c .ic{width:13px;height:13px;vertical-align:-.2em;margin-right:3px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--cream);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-4px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:768px){:root{--appw:640px}}
  /* 起動時だけ：ロゴ → MANUAL → 手前へ抜けて本編へ（在庫アプリと同じ演出） */
  .intro{position:fixed;inset:0;z-index:2000;background:var(--bg);display:grid;place-items:center;
    overflow:hidden;animation:introFailsafe 10s step-end forwards}
  .intro:not(.started) .intro-stage{visibility:hidden}
  .intro:not(.started) .intro-stage *{animation-play-state:paused!important}
  .intro-stage{display:flex;flex-direction:column;align-items:center;gap:26px;transform-origin:center;will-change:transform,opacity,filter}
  .intro-logo{display:block;width:clamp(150px,23vw,205px);height:auto;opacity:1;animation:none}
  .intro-title{display:block;width:clamp(150px,23vw,205px);max-width:82vw;height:auto;overflow:visible;flex:none;opacity:1}
  .intro-glyph{opacity:0}
  .intro-caret{opacity:0}
  @keyframes introType{from{opacity:0}to{opacity:1}}
  @keyframes introCaret{0%,99%{opacity:1}100%{opacity:0}}
  .intro.leaving{animation:introZoomCurtain 1.35s linear forwards}
  .intro.leaving .intro-stage{animation:introApproach 1.35s linear forwards}
  .intro.leaving .intro-stage{transform-origin:50% 28%}
  @keyframes introZoomCurtain{0%,92%{opacity:1}100%{opacity:0}}

  @keyframes introFailsafe{to{visibility:hidden;pointer-events:none}}
  @media(prefers-reduced-motion:reduce){
    .intro-logo,.intro-title,.intro-glyph{animation:none;opacity:1;transform:none}
    .intro-caret{display:none}
    .intro.leaving{animation:introCurtain .15s linear forwards}
    .intro.leaving .intro-stage{animation:none}

/* 現場の切り替え：トップ以外の画面で、ヘッダーに小さく2段で固定 */
.catnav{display:none}
.incat .catnav{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;max-width:var(--appw);margin:0 auto;padding:0 10px 7px}
.cn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;height:32px;padding:2px 1px 1px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--cream);border-radius:8px;font-size:8.6px;font-weight:800;line-height:1.1;white-space:nowrap}
.cn .ic{width:14px;height:14px;color:var(--lt)}
.cn span{max-width:100%;overflow:hidden}
.cn .f{display:none}
.cn.on{background:var(--card);border-color:var(--card);color:var(--ink)}
.cn.on .ic{color:var(--ac)}
.cn:active{transform:scale(.95)}
@media(min-width:768px){.cn{font-size:10.5px}.cn .s{display:none}.cn .f{display:inline}}
.incat header.top{padding:6px 14px 5px}
.incat .hbtn{padding:5px 12px;font-size:12px}
.incat .ttl{font-size:17px}
.incat .ttl .hdlogo{height:22px}
/* 右へスライドでトップへ戻る：横の動きはこのアプリで受ける（縦スクロールと拡大は今まで通り） */
html{overscroll-behavior-x:none}
html,body{touch-action:pan-y pinch-zoom}
/* 右下のボタン：＋＝追加作成／鉛筆＝修正（修正モード中は「完了」に変わる） */
.fabs{position:fixed;right:max(14px,calc(50vw - var(--appw)/2 + 14px));bottom:calc(16px + env(safe-area-inset-bottom));z-index:25;display:flex;flex-direction:column;gap:10px;align-items:center}
.fab{width:58px;height:58px;border-radius:50%;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;line-height:1.15;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .12s}
.fab:active{transform:scale(.93)}
.fab .ic{width:22px;height:22px}
.fab-add{background:var(--coral);color:#fff;box-shadow:0 6px 18px rgba(216,85,44,.45)}
.fab-edit{background:var(--card);color:var(--coral);border:2px solid var(--coral)}
.fab-edit.on{background:var(--coral);color:#fff}
/* 修正モード：直せる行を点線で囲み、鉛筆の印を付ける。行の上に透明の覆いを重ね、タップで修正画面を開く */
.edrow{position:relative;outline:2px dashed rgba(255,176,150,.95);outline-offset:3px;border-radius:12px}
.edcover{position:absolute;inset:-3px;z-index:3;cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:rgba(216,85,44,.25)}
.edtag{position:absolute;top:-11px;right:-5px;z-index:4;width:24px;height:24px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:none}
.edtag .ic{width:13px;height:13px;stroke-width:2.2;vertical-align:0}
#edhint{position:fixed;left:max(14px,calc(50vw - var(--appw)/2 + 14px));bottom:calc(22px + env(safe-area-inset-bottom));z-index:24;background:rgba(42,36,32,.92);color:#fff;font-size:12.5px;font-weight:700;border-radius:999px;padding:9px 16px;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none;display:none;max-width:calc(100% - 100px);line-height:1.35}
body.editing #edhint{display:block}
/* 追加・修正の画面 */
.sheet .chk{display:flex;align-items:flex-start;gap:9px;margin:13px 0 0;font-size:13px;font-weight:700;color:var(--ink)}
.sheet .chk input{width:19px;height:19px;padding:0;flex:none;margin:1px 0 0;accent-color:var(--coral)}
.sheet .subl{font-size:12.5px;font-weight:700;color:var(--sub);margin:-6px 0 4px}
.sheet .hint{font-size:12px;color:var(--sub);line-height:1.5;margin:6px 2px 0}
.sheet .edphoto{width:100%;max-height:160px;object-fit:contain;background:var(--gray-bg);border-radius:10px;margin-bottom:2px}
.sheet .delbtn{width:100%;border:1.5px solid var(--red);background:none;color:var(--red);border-radius:12px;padding:11px;font-size:14px;font-weight:800;margin-top:10px}
.sheet .go.danger{background:var(--red);margin-top:10px}
.sheet .delmsg{font-size:13px;color:#8b2a24;font-weight:700;margin-top:12px;line-height:1.5}
.sheet button:disabled{opacity:.5}
</style>
</head>

async function fetchJSON(url,opt){
  for(let i=0;i<4;i++){
    try{
      const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),25000);
      const r=await fetch(url,{...opt,signal:ctl.signal});clearTimeout(t);
      if(r.ok)return await r.json();
    }catch(e){}
    await new Promise(r=>setTimeout(r,1200));
  }
  throw new Error('接続できませんでした');
}
const fmtDate=s=>{const m=String(s).match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);return m?`${+m[1]}/${+m[2]}/${+m[3]}`:String(s);};
function assemble(raw){
  const content={};
  (raw.content||[]).forEach((r,idx)=>{
    const cat=String(r[0]||'').trim();
    if(!CATEGORIES.some(c=>c.name===cat))return;
    /* n＝シート上の行番号、o＝シートにある元の文字（修正・削除のとき「画面が見ていた内容」として送り返す） */
    (content[cat]=content[cat]||[]).push({type:String(r[1]||'').trim()||'箇条書き',label:r[2]||'',text:r[3]||'',photo:String(r[4]||'').trim(),src:r[5]||'',
      n:idx+2,o:{type:String(r[1]??''),label:String(r[2]??''),text:String(r[3]??''),photo:String(r[4]??'')}});
  });
  const updates=(raw.updates||[]).filter(r=>r&&String(r[0]).trim())
    .map(r=>({date:fmtDate(r[0]),title:r[1]||'',note:r[2]||'',cat:String(r[3]||'').trim(),by:r[4]||''}));
  updates.reverse();
  return {categories:CATEGORIES,content,updates,today:raw.today};
}
const LS_KEY='dorayama_manual_cache_v1';
async function boot(){
  let shownFromCache=false;
  try{
    const cached=localStorage.getItem(LS_KEY);
    if(cached){M=assemble(JSON.parse(cached));render();shownFromCache=true;introReady();}
  }catch(e){}
  try{
    const raw=await fetchJSON(API+'?action=manual');
    try{localStorage.setItem(LS_KEY,JSON.stringify(raw));}catch(e){}
    M=assemble(raw);render();introReady();
  }catch(e){introReady();
    if(!shownFromCache)$('#app').innerHTML='<div id="load">'+ic('alert')+' 読み込めませんでした<br><br><button class="moreu" onclick="boot()">'+ic('refresh')+' もう一度</button></div>';
  }
}
function daysAgo(dstr){
  const m=String(dstr).match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);if(!m)return 999;
  return Math.floor((new Date(M.today)-new Date(+m[1],+m[2]-1,+m[3]))/86400000);
}

function search(q){
  const box=$('#hits'),home=$('#homebody');
  if(!q){box.innerHTML='';home.style.display='';return;}
  home.style.display='none';
  const hits=[];
  for(const c of M.categories){
    let sec='';
    for(const r of (M.content[c.name]||[])){
      if(r.type==='見出し'){sec=r.text;continue;}
      const hay=(r.label+' '+r.text+' '+sec);
      if(hay.includes(q))hits.push({cat:c,sec,r});
      if(hits.length>=40)break;
    }
  }
  const hl=t=>esc(t).split(esc(q)).join('<mark>'+esc(q)+'</mark>');
  box.innerHTML=hits.length?hits.map(h=>`
    <div class="hit" onclick="go({name:'cat',cat:'${esc(h.cat.name)}'})">
      <span class="c" style="background:#${h.cat.accent}">${ic(h.cat.icon)}${esc(h.cat.name)}</span>
      <div class="h">${h.r.label?hl(h.r.label):esc(h.sec)}</div>
      <div class="t">${hl(h.r.text.slice(0,90))}${h.r.text.length>90?'…':''}</div>
    </div>`).join(''):'<div class="hit">「'+esc(q)+'」は見つかりませんでした</div>';
}

      <div><div class="n">${esc(name)}</div><div class="s">${esc(c.sub)}</div></div></div>`;
  for(const r of rows){
    const t=r.type,start=h.length;
    if(t==='見出し')h+=`<div class="bar">${esc(r.text)}</div>`;
    else if(t==='項目')h+=`<div class="item"><span class="lb">${esc(r.label)}</span><span class="tx">${esc(r.text)}</span></div>`;
    else if(t==='箇条書き')h+=`<div class="bul"><span>${esc(r.text)}</span></div>`;
    else if(t==='注意')h+=`<div class="note warn">${ic('alert')}<span>${esc(r.text)}</span></div>`;

    else if(t==='ポイント')h+=`<div class="note star">${ic('star')}<span>${esc(r.text)}</span></div>`;
    else if(t==='禁止')h+=`<div class="ng"><i class="x">${ic('x')}</i><span>${esc(r.text)}</span></div>`;
    else if(t==='流れ')h+=`<div class="flow">${r.text.split(' → ').map((s,i,a)=>`<span class="st${i===a.length-1?' last':''}">${esc(s)}</span>${i<a.length-1?'<span class="ar">'+ic('next')+'</span>':''}`).join('')}</div>`;
    else if(t==='冷蔵庫')h+=`<div class="fifo"><div class="cap">【冷蔵庫の置き方（先入れ先出し）】</div>
      <div class="g"><div class="c" style="background:#F8CBAD">① いちばん古い（最初に使う）</div><div class="c" style="background:#FCE4D6">② 次に古い</div>

    else if(t==='写真'&&r.photo)h+=`<div class="ph" onclick="lightbox('./img/${esc(r.photo)}','${esc(r.label)}')"><img loading="lazy" src="./img/${esc(r.photo)}"><div class="cap">${ic('camera')}${esc(r.label)}</div></div>`;

    ${whoFields()}
    <div class="err" id="f_err"></div>
    <button class="go" onclick="submitEdit(${n})">この内容で保存する</button>
    <button class="delbtn" id="e_del" onclick="askDelete()">この行を削除する</button>
    <div id="e_delbox" style="display:none"><div class="delmsg">この行を削除します。よろしいですか？（消した内容は、シートの記録に残ります）</div>
      <button class="go danger" onclick="submitDelete(${n})">削除する</button></div>
    <button class="cancel" onclick="closeModal()">やめる</button>`;
  fillWho();
  if(!FIXED_TYPES.includes(t))syncType('e');
  $('#modal').classList.add('on');
}
function askDelete(){
  $('#e_del').style.display='none';$('#e_delbox').style.display='';
  $('#e_delbox').scrollIntoView({block:'nearest',behavior:'smooth'});
}
async function submitEdit(n){
  const r=findRow(n);if(!r)return;
  const cat=view.cat,t=r.type;
  let typ=t,label='',text='';
  if(!FIXED_TYPES.includes(t)){typ=$('#e_type').value;label=typ==='項目'?$('#e_label').value.trim():'';text=$('#e_text').value.trim();}
  else if(t==='流れ'){text=$('#e_text').value.trim();}
  else if(t==='カード'){label=$('#e_label').value.trim();text=$('#e_text').value.trim();}
  else{label=$('#e_label').value.trim();text=r.o.text;}
  if(t==='写真'){if(!label){showErr('写真の説明を入れてください');return;}}
  else if(t==='カード'&&!label){showErr('見出し部分を入れてください');return;}
  else if(!text){showErr('内容を入れてください');return;}
  const ann=$('#f_ann').checked;
  let head=text||label;if(head.length>40)head=head.slice(0,39)+'…';
  const body={action:'edit',cat,n,before:r.o,after:{type:typ,label,text},by:$('#f_by').value.trim(),code:$('#f_code').value.trim()};
  if(ann){body.announce=true;body.upd_title=`${cat}を修正`;body.upd_note=head;}
  await saveCall(body,ann?'修正しました。お知らせにも掲載されます':'修正しました');
}
async function submitDelete(n){
  const r=findRow(n);if(!r)return;
  await saveCall({action:'delete',cat:view.cat,n,before:r.o,by:$('#f_by').value.trim(),code:$('#f_code').value.trim()},'削除しました');
}
/* 追加・修正・削除の送信。通信が不安定でやり直しても二重に反映されないよう、送信ごとの番号(rid)を付ける */
async function saveCall(body,okMsg){
  if(!body.code){showErr('合言葉を入れてください');return;}
  body.rid=newRid();
  const btns=[...document.querySelectorAll('#sheetbody button')];
  btns.forEach(b=>b.disabled=true);
  const unlock=()=>btns.forEach(b=>b.disabled=false);
  try{
    const r=await fetchJSON(API,{method:'POST',body:JSON.stringify(body)});
    if(!r.ok){
      if(r.error==='CHANGED'){
        closeModal();
        try{await reloadManual();}catch(e){}
        toast('ほかの人が先に変更していました。最新の内容に更新しました');return;
      }
      showErr(ERR[r.error]||r.error||'保存できませんでした');unlock();return;
    }
    localStorage.setItem('manual_code',body.code);
    if(body.by)localStorage.setItem('manual_by',body.by);
    closeModal();toast(r.unchanged?'変更はありませんでした':okMsg);
    try{await reloadManual();}catch(e){toast('保存しました。画面は開き直すと更新されます');}
  }catch(e){showErr('通信エラー。電波の良いところでもう一度');unlock();}
}
async function reloadManual(){
  const raw=await fetchJSON(API+'?action=manual');
  try{localStorage.setItem(LS_KEY,JSON.stringify(raw));}catch(e){}
  M=assemble(raw);render();
}

/* ---------- お知らせ ---------- */
function openAnnounce(){
  $('#sheetbody').innerHTML=`<h3>${ic('megaphone')}お知らせを投稿する</h3>
    <label>タイトル ＊必須</label><input id="a_title" placeholder="例: 7/20から営業時間が変わります">
    <label>くわしく（任意）</label><textarea id="a_note"></textarea>
    <label>関係する現場（任意）</label>
    <select id="a_cat"><option value="">（全体）</option>${M.categories.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select>
    <div class="srow"><div><label>あなたの名前</label><input id="a_by"></div>
    <div><label>合言葉</label><input id="a_code"></div></div>
    <div class="err" id="f_err"></div>
    <button class="go" onclick="submitAnnounce()">投稿する</button>
    <button class="cancel" onclick="closeModal()">やめる</button>`;
  $('#a_code').value=localStorage.getItem('manual_code')||'';
  $('#modal').classList.add('on');
}
async function submitAnnounce(){
  const title=$('#a_title').value.trim();if(!title){showErr('タイトルを入れてください');return;}
  const code=$('#a_code').value.trim();
  try{
    const r=await fetchJSON(API,{method:'POST',
      body:JSON.stringify({action:'announce',title,note:$('#a_note').value.trim(),cat:$('#a_cat').value,by:$('#a_by').value.trim(),code})});
    if(!r.ok){showErr(r.error==='BAD_CODE'?'合言葉が違います':(r.error||'投稿できませんでした'));return;}
    localStorage.setItem('manual_code',code);
    closeModal();toast('お知らせを投稿しました');
    M=assemble(await fetchJSON(API+'?action=manual'));render();
  }catch(e){showErr('通信エラー。もう一度お試しください');}
}
function showErr(m){const e=$('#f_err');e.textContent=m;e.style.display='block';}
function closeModal(){$('#modal').classList.remove('on');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
function toast(m){const t=$('#toast');t.innerHTML=ic('check')+esc(m);t.style.display='block';setTimeout(()=>t.style.display='none',2600);}
function introLoadStyle(state){
 state.style='zoom';state.styleReady=true;state.exitMs=state.reduce?180:1400;
 introPlay(state);introTryExit();
}

var INTRO_STATE=null;
function introCompleteTitle(state){
  if(!state||state.leaving)return;
  clearTimeout(state.typeTimer);
  state.el.querySelectorAll('.intro-glyph').forEach(function(g){g.style.opacity='1';});
  state.el.querySelectorAll('.intro-caret').forEach(function(c){c.style.opacity='0';});
  if(!state.titleDone){state.titleDone=true;state.titleAt=Date.now();state.el.classList.add('typed');}
  introTryExit();
}
function introTypeNext(state){
  if(state.leaving||state.titleDone)return;
  var glyphs=state.el.querySelectorAll('.intro-glyph'),carets=state.el.querySelectorAll('.intro-caret');
  carets.forEach(function(c){c.style.opacity='0';});
  if(state.typeIndex>=glyphs.length){introCompleteTitle(state);return;}
  glyphs[state.typeIndex].style.opacity='1';
  if(carets[state.typeIndex])carets[state.typeIndex].style.opacity='1';
  state.typeIndex++;
  state.typeTimer=setTimeout(function(){introTypeNext(state);},120);
}
function startIntro(){
  if(INTRO_STATE)return;
  var el=document.getElementById('intro');if(!el)return;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var state=INTRO_STATE={el:el,min:false,ready:!!M,leaving:false,titleDone:false,titleAt:0,typeIndex:0,reduce:reduce,style:'zoom',styleReady:false,startedAt:Date.now(),exitMs:reduce?180:1400};
  introLoadStyle(state);
}
function introPlay(state){
  if(state.playing)return;state.playing=true;state.startedAt=state.styleAt=Date.now();
  state.el.classList.add('started');
  if(state.reduce)introCompleteTitle(state);
  else {clearTimeout(state.typeTimer);state.typeTimer=setTimeout(function(){introTypeNext(state);},650);}
  setTimeout(function(){state.min=true;introTryExit();},state.reduce?200:2200);
  state.deadline=setTimeout(function(){
    state.min=true;state.ready=true;introCompleteTitle(state);introTryExit();
  },6000);
}
function introReady(){if(INTRO_STATE){INTRO_STATE.ready=true;introTryExit();}}
function introTryExit(){
  var state=INTRO_STATE;if(!state||!state.min||!state.ready||!state.titleDone||!state.styleReady||state.leaving)return;
  var hold=state.reduce?0:Math.max(0,450-(Date.now()-state.titleAt));
  if(hold>0){clearTimeout(state.holdTimer);state.holdTimer=setTimeout(introTryExit,hold);return;}
  state.leaving=true;clearTimeout(state.deadline);clearTimeout(state.typeTimer);state.el.classList.add('leaving');
  setTimeout(function(){state.el.remove();},state.exitMs);
}
/* ---------- 右へスライドでトップへ戻る ---------- */
(function(){
  var app=document.getElementById('app'),sx=0,sy=0,dx=0,mode=null,on=false,t0=0;
  function free(){
    return view.name==='cat'&&!document.getElementById('intro')&&!$('#modal').classList.contains('on')&&getComputedStyle($('#lightbox')).display==='none';
  }
  function settle(){app.style.transition='transform .2s ease,opacity .2s ease';app.style.transform='';app.style.opacity='';setTimeout(function(){app.style.transition='';},230);}
  document.addEventListener('touchstart',function(e){
    if(e.touches.length!==1||!free()){on=false;return;}
    var t=e.touches[0];sx=t.clientX;sy=t.clientY;dx=0;mode=null;on=true;t0=Date.now();app.style.transition='none';
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!on)return;
    var t=e.touches[0],mx=t.clientX-sx,my=t.clientY-sy;
    if(mode===null&&(Math.abs(mx)>12||Math.abs(my)>12))mode=(mx>0&&Math.abs(mx)>Math.abs(my)*1.5)?'h':'v';
    if(mode==='h'){
      dx=Math.max(0,mx);
      app.style.transform='translateX('+dx+'px)';
      app.style.opacity=String(Math.max(.35,1-dx/(window.innerWidth*1.2)));
    }
  },{passive:true});
  document.addEventListener('touchend',function(){
    if(!on)return;on=false;
    if(mode!=='h'){settle();return;}
    var quick=(Date.now()-t0)<260&&dx>50;
    if(dx>window.innerWidth*0.28||quick){
      app.style.transition='transform .2s ease-in,opacity .2s ease-in';
      app.style.transform='translateX('+window.innerWidth+'px)';app.style.opacity='0';
      setTimeout(function(){
        go({name:'home'});
        app.style.transition='none';app.style.transform='translateX(-28px)';app.style.opacity='0';
        void app.offsetWidth;
        app.style.transition='transform .26s ease-out,opacity .26s ease-out';
        app.style.transform='';app.style.opacity='';
        setTimeout(function(){app.style.transition='';},300);
      },190);
    }else settle();
  },{passive:true});
  document.addEventListener('touchcancel',function(){if(on){on=false;settle();}},{passive:true});
})();
startIntro();
boot();
</script>
</body>
</html>
